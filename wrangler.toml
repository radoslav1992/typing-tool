# Cloudflare Workers (static assets) configuration.
#
# This repo deploys as a Worker that serves the static Astro build from ./dist.
# Cloudflare's "Workers Builds" runs `npx wrangler deploy`, which uses this file.
#
# Deploy manually with:  npm run build && npx wrangler deploy
name = "typing-tool"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
# Serve our branded 404 page for unknown paths.
not_found_handling = "404-page"
